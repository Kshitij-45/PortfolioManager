spring.application.name=PortfolioManagmentApplication
spring.profiles.default=local
spring.web.resources.static-locations=classpath:/static/,file:./frontend/
yahoo.api.connect-timeout-ms=2500
yahoo.api.read-timeout-ms=5000
recommendation.ai.enabled=${RECOMMENDATION_AI_ENABLED:false}
recommendation.ai.api-url=${RECOMMENDATION_AI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
recommendation.ai.model=${RECOMMENDATION_AI_MODEL:gemini-2.5-flash}
recommendation.ai.api-key=${RECOMMENDATION_AI_API_KEY:}
recommendation.ai.max-score-adjustment=${RECOMMENDATION_AI_MAX_SCORE_ADJUSTMENT:2}
recommendation.ai.max-calls-per-minute=${RECOMMENDATION_AI_MAX_CALLS_PER_MINUTE:1}
