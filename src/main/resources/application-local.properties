spring.datasource.url=${DB_URL:jdbc:h2:mem:portfolio_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

recommendation.ai.enabled=${RECOMMENDATION_AI_ENABLED:true}
recommendation.ai.api-url=${RECOMMENDATION_AI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
recommendation.ai.model=${RECOMMENDATION_AI_MODEL:gemini-2.5-flash}
recommendation.ai.api-key=${RECOMMENDATION_AI_API_KEY:}
